version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      playwright:
        # IMPORTANT: Whenever Dependabot updates @playwright/test, you MUST sync
        # the container image tag in .github/workflows/ci.yml
        # (mcr.microsoft.com/playwright:v<version>-noble) and
        # scripts/update-visual-baselines.sh so the preinstalled Chromium
        # binary matches the npm package version.
        patterns:
          - '@playwright/test'
          - 'playwright'
    ignore:
      # `vite` is aliased to `@voidzero-dev/vite-plus-core` and pinned alongside `vite-plus` (#34).
      # Update `vite-plus` first, then sync the `vite` alias and `pnpm-workspace.yaml` overrides together.
      - dependency-name: 'vite'
      # Must stay pinned to the exact Vitest version bundled by `vite-plus`.
      - dependency-name: '@vitest/coverage-v8'
      # Deferred until svelte-check natively supports TypeScript >= 7 without dual-TS aliases (#22).
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
