version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      playwright:
        # IMPORTANT: Whenever Dependabot updates @playwright/test, you MUST sync
        # the container image tag in .github/workflows/ci.yml
        # (mcr.microsoft.com/playwright:v<version>-noble) and
        # scripts/update-visual-baselines.sh so the preinstalled Chromium
        # binary matches the npm package version.
        patterns:
          - '@playwright/test'
          - 'playwright'
    ignore:
      # Deferred to Phase 6 (#34): @sveltejs/vite-plugin-svelte >= 6 requires Vite >= 6.3,
      # which breaks vitest@2.1.x (bundled with vite@5.4.x).
      - dependency-name: '@sveltejs/vite-plugin-svelte'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'vite'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'vitest'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@vitest/coverage-v8'
        update-types:
          - 'version-update:semver-major'
      # Deferred until svelte-check natively supports TypeScript >= 7 without dual-TS aliases (#22).
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
