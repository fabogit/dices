version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      playwright:
        # IMPORTANT: Whenever Dependabot updates @playwright/test, you MUST sync
        # the container image tag in .github/workflows/ci.yml
        # (mcr.microsoft.com/playwright:v<version>-noble) and
        # scripts/update-visual-baselines.sh so the preinstalled Chromium
        # binary matches the npm package version.
        patterns:
          - '@playwright/test'
          - 'playwright'
    ignore:
      # `vite-plus`, the `vite` alias (`package.json`), `pnpm-workspace.yaml` overrides (`vite@*`, `vitest@*`),
      # and `peerDependencyRules.allowedVersions.vite` must all stay pinned to the exact same version (#34).
      # Upgrade procedure: run `vp migrate` (updates `vite-plus`, the `vite` alias, and `vitest` overrides),
      # then update `peerDependencyRules.allowedVersions.vite` and `@vitest/coverage-v8` manually to match.
      - dependency-name: 'vite-plus'
      - dependency-name: 'vite'
      # Must stay pinned to the exact Vitest version bundled by `vite-plus`.
      - dependency-name: '@vitest/coverage-v8'
      # Deferred until svelte-check natively supports TypeScript >= 7 without dual-TS aliases (#22).
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
