name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: no job writes to the repo, PRs or checks; artifacts use the runtime token.
permissions:
  contents: read

# Cancel superseded PR runs; never cancel runs on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Guard, Check, Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check E2E selector guard
        run: pnpm run test:e2e:guard

      - name: Verify Playwright container tag matches installed version
        run: pnpm run check:playwright-version

      - name: Lint, format & type check
        run: pnpm run check

      - name: Run unit tests with V8 coverage
        run: pnpm run test:coverage

      - name: Build production bundle
        run: pnpm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    name: E2E (Playwright)
    needs: build-and-test
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Playwright E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
