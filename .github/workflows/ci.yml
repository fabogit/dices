name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Guard, Check, Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check E2E selector guard
        run: pnpm run test:e2e:guard

      - name: Verify Playwright container tag matches package.json
        run: |
          node --input-type=module - <<'EOF'
          import { readFileSync } from 'node:fs';

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const ci = readFileSync('.github/workflows/ci.yml', 'utf8');
          const pkgSpec = pkg.devDependencies?.['@playwright/test'];
          if (!pkgSpec) {
            throw new Error('Missing @playwright/test in package.json devDependencies');
          }
          const pkgVer = pkgSpec.replace(/^[\^~]/, '');
          const match = ci.match(/mcr\.microsoft\.com\/playwright:v(\d+\.\d+\.\d+)/);
          if (!match) {
            throw new Error('Missing Playwright container image tag in .github/workflows/ci.yml');
          }
          const imgVer = match[1];
          if (pkgVer !== imgVer) {
            throw new Error(
              `Playwright version mismatch: package.json has ${pkgSpec} (${pkgVer}) but ci.yml uses v${imgVer}`,
            );
          }
          console.log(`Playwright version verified: v${imgVer}`);
          EOF

      - name: Type check
        run: pnpm run check

      - name: Run unit tests with V8 coverage
        run: pnpm run test:coverage

      - name: Build production bundle
        run: pnpm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    name: E2E (Playwright)
    needs: build-and-test
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Playwright E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
