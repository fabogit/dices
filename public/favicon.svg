<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background / Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="topFace" x1="12" y1="10" x2="52" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="leftFace" x1="12" y1="22" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="rightFace" x1="32" y1="34" x2="52" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <radialGradient id="pipGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </radialGradient>
  </defs>

  <!-- Ambient Floor Shadow -->
  <ellipse cx="32" cy="56" rx="20" ry="5" fill="#000000" opacity="0.4" />

  <!-- Isometric Die Facets -->
  <!-- Top Face -->
  <polygon points="32,10 52,22 32,34 12,22" fill="url(#topFace)" stroke="#38bdf8" stroke-width="1.2" stroke-linejoin="round" />
  
  <!-- Left Face -->
  <polygon points="12,22 32,34 32,56 12,44" fill="url(#leftFace)" stroke="#38bdf8" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Right Face -->
  <polygon points="52,22 52,44 32,56 32,34" fill="url(#rightFace)" stroke="#38bdf8" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Glowing Pips -->
  <!-- Top Face Pip (Center 1) -->
  <ellipse cx="32" cy="22" rx="2.5" ry="1.6" fill="url(#pipGlow)" filter="url(#glow)" />

  <!-- Left Face Pips (Diagonal 2) -->
  <circle cx="20" cy="32" r="1.8" fill="url(#pipGlow)" filter="url(#glow)" />
  <circle cx="24" cy="46" r="1.8" fill="url(#pipGlow)" filter="url(#glow)" />

  <!-- Right Face Pips (Triad 3) -->
  <circle cx="44" cy="32" r="1.8" fill="url(#pipGlow)" filter="url(#glow)" />
  <circle cx="42" cy="39" r="1.8" fill="url(#pipGlow)" filter="url(#glow)" />
  <circle cx="40" cy="46" r="1.8" fill="url(#pipGlow)" filter="url(#glow)" />
</svg>
